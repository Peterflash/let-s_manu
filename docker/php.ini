; Réglages PHP du conteneur de développement
date.timezone = Africa/Abidjan
expose_php = Off

; Envoi de photos (formulaire de devis : 5 photos de 8 Mo au plus ; administration : plusieurs photos par réalisation)
upload_max_filesize = 16M
post_max_size = 96M
max_file_uploads = 20
memory_limit = 384M

; Les erreurs s'affichent en local (le site les masque automatiquement hors de localhost)
log_errors = On
error_log = /dev/stderr
; Avant le démarrage du site (ex. envoi plus lourd que post_max_size), l'avertissement va au journal
; au lieu d'être affiché : affiché, il empêcherait la session de démarrer. Le site réactive ensuite
; l'affichage des erreurs en local (app/bootstrap.php), comme sur l'hébergement.
display_errors = Off
